name: bigbluebutton

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  graphql-actions:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/bigbluebutton-graphql-actions:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.graphql-actions
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8093
      BBB_REDIS_HOST: redis
      BBB_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  graphql-server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/bigbluebutton-graphql-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.graphql-server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGHOST: postgres
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-bigbluebutton}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
    ports:
      - "${HASURA_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      graphql-actions:
        condition: service_started

  graphql-middleware:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/bigbluebutton-graphql-middleware:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.graphql-middleware
    restart: unless-stopped
    ports:
      - "${GRAPHQL_MIDDLEWARE_PORT:-8378}:8378"
    depends_on:
      redis:
        condition: service_healthy
      graphql-server:
        condition: service_started
      graphql-actions:
        condition: service_started

  export-annotations:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/bigbluebutton-export-annotations:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.export-annotations
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  html5:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/bigbluebutton:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTML5_PORT:-8080}:80"
    depends_on:
      - graphql-middleware

  greenlight:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/jessielung-design}/greenlight:${GREENLIGHT_TAG:-latest}
    profiles: ["greenlight"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/greenlight-v3-production
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-me}
      BIGBLUEBUTTON_ENDPOINT: ${BIGBLUEBUTTON_ENDPOINT:-}
      BIGBLUEBUTTON_SECRET: ${BIGBLUEBUTTON_SECRET:-}
      PORT: 3000
    ports:
      - "${GREENLIGHT_PORT:-5050}:3000"
    volumes:
      - greenlight-storage:/usr/src/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
  greenlight-storage:
