name: Publish GHCR images

on:
  push:
    branches: [v3.0.x-develop, develop, main, master]
    tags: ["v*"]
  pull_request:
    branches: [v3.0.x-develop, develop, main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bigbluebutton
            file: Dockerfile
            image: bigbluebutton
          - name: graphql-actions
            file: docker/Dockerfile.graphql-actions
            image: bigbluebutton-graphql-actions
          - name: graphql-middleware
            file: docker/Dockerfile.graphql-middleware
            image: bigbluebutton-graphql-middleware
          - name: graphql-server
            file: docker/Dockerfile.graphql-server
            image: bigbluebutton-graphql-server
          - name: export-annotations
            file: docker/Dockerfile.export-annotations
            image: bigbluebutton-export-annotations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
